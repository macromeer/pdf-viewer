name: Publish to Open VSX

# Uploads the VSIX of an existing GitHub release to Open VSX. Called by
# release.yml after each release; run it by hand to (re)publish a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v2.0.1
        required: true
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      OVSX_PAT:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-ovsx-${{ inputs.tag }}
    steps:
      # Only for the tooling (ovsx from the lockfile); what gets published
      # comes from the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern '*.vsix' --dir dist
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z $OVSX_PAT ]]; then
            echo "::error::The OVSX_PAT secret is not set"
            exit 1
          fi
          vsix=$(echo dist/*.vsix)
          manifest=$(unzip -p "$vsix" extension/package.json)
          publisher=$(jq -r .publisher <<< "$manifest")
          name=$(jq -r .name <<< "$manifest")
          version=$(jq -r .version <<< "$manifest")
          api=https://open-vsx.org/api
          # Reruns are safe: skip a version that is already there
          if curl -sf "$api/$publisher/$name/$version" > /dev/null; then
            echo "$publisher.$name $version is already on Open VSX"
            exit 0
          fi
          if ! curl -sf "$api/$publisher" > /dev/null; then
            npx ovsx create-namespace "$publisher"
          fi
          npx ovsx publish "$vsix"
